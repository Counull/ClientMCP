<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
  <title id="title">ClientMCP 单仓库开发与 UPM 发布</title>
  <desc id="desc">完整 Git 仓库包含文档、Unity 验证工程和唯一 UPM 源码包。使用方通过 Git URL 的 path 与版本标签安装包。</desc>
  <defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#64748b"/></marker></defs>
  <rect width="1200" height="720" rx="24" fill="#0f172a"/>
  <g font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif">
    <text x="56" y="66" fill="#f8fafc" font-size="30" font-weight="bold">ClientMCP · 一个仓库，一份包源码</text>
    <text x="56" y="103" fill="#94a3b8" font-size="18">完整工程管理历史 · Git URL 按子目录安装 · 标签固定版本</text>
    <rect x="50" y="140" width="700" height="400" rx="18" fill="#1e293b" stroke="#475569"/>
    <text x="78" y="181" fill="#f8fafc" font-size="23">GitHub / Counull / ClientMCP</text>
    <rect x="78" y="207" width="643" height="63" rx="10" fill="#334155"/>
    <text x="101" y="246" fill="#e2e8f0" font-size="20">doc/　设计、验证记录、发布流程</text>
    <rect x="78" y="290" width="643" height="218" rx="12" fill="#172554" stroke="#3b82f6"/>
    <text x="101" y="328" fill="#bfdbfe" font-size="22">Project/　Unity 6000.5.9f1 验证工程</text>
    <text x="101" y="365" fill="#cbd5e1" font-size="18">Assets/ + ProjectSettings/　场景与工程配置</text>
    <rect x="101" y="390" width="593" height="90" rx="10" fill="#064e3b" stroke="#34d399"/>
    <text x="120" y="426" fill="#a7f3d0" font-size="20">Packages/com.counull.clientmcp/</text>
    <text x="120" y="458" fill="#d1fae5" font-size="17">package.json + Runtime/　唯一插件源码</text>
    <rect x="815" y="207" width="333" height="94" rx="12" fill="#312e81" stroke="#a5b4fc"/>
    <text x="838" y="245" fill="#e0e7ff" font-size="22">Git 标签 / 提交 SHA</text>
    <text x="838" y="277" fill="#c7d2fe" font-size="17">锁定整个仓库的一次快照</text>
    <rect x="815" y="379" width="333" height="110" rx="12" fill="#134e4a" stroke="#5eead4"/>
    <text x="838" y="419" fill="#ccfbf1" font-size="22">其他 Unity 游戏工程</text>
    <text x="838" y="453" fill="#99f6e4" font-size="17">Package Manager → Git URL</text>
    <path d="M700 435H804" fill="none" stroke="#64748b" stroke-width="3" marker-end="url(#arrow)"/>
    <path d="M980 305V368" fill="none" stroke="#64748b" stroke-width="3" marker-end="url(#arrow)"/>
    <rect x="50" y="574" width="1098" height="97" rx="12" fill="#020617" stroke="#334155"/>
    <text x="74" y="609" fill="#7dd3fc" font-size="18">安装地址 = 仓库 URL + ?path=/Project/Packages/com.counull.clientmcp + #版本标签</text>
    <text x="74" y="645" fill="#94a3b8" font-size="17">初始化仅提供包骨架；MCP 通信与诊断能力待实现。无需额外发布仓库或预编译 DLL。</text>
  </g>
</svg>
